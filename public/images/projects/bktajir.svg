<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>
    <linearGradient id="bk-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bk-card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181B24" />
      <stop offset="100%" stop-color="#12141B" />
    </linearGradient>
    <pattern id="bk-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(245,158,11,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bk-bg)" />
  <rect width="1200" height="700" fill="url(#bk-grid)" />

  <!-- Outer Browser Mockup Frame -->
  <rect x="40" y="40" width="1120" height="620" rx="8" fill="#111319" stroke="#252936" stroke-width="1.5" />

  <!-- Browser Chrome Top Bar -->
  <rect x="40" y="40" width="1120" height="46" rx="8" fill="#171922" />
  <circle cx="70" cy="63" r="5" fill="#EF4444" />
  <circle cx="88" cy="63" r="5" fill="#F59E0B" />
  <circle cx="106" cy="63" r="5" fill="#10B981" />

  <!-- Browser URL Address Bar -->
  <rect x="140" y="52" width="620" height="24" rx="4" fill="#0C0D12" stroke="#252936" stroke-width="1" />
  <circle cx="156" cy="64" r="4" fill="#10B981" />
  <text x="170" y="68" fill="#9CA3AF" font-family="'Space Grotesk', monospace" font-size="12">https://bktajir.com — Pakistan's Luxury Watches, Earbuds &amp; Footwear</text>

  <!-- Status Chip on Top Bar -->
  <rect x="940" y="52" width="190" height="24" rx="4" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)" stroke-width="1" />
  <text x="955" y="68" fill="#F59E0B" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11">CASH ON DELIVERY NATIONWIDE</text>

  <!-- Accent Divider -->
  <rect x="40" y="86" width="1120" height="2" fill="url(#bk-gold)" />

  <!-- Site Store Header -->
  <g transform="translate(80, 110)">
    <!-- Brand Mark -->
    <rect x="0" y="0" width="34" height="34" rx="4" fill="url(#bk-gold)" />
    <text x="7" y="24" fill="#0B0C10" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="19">BK</text>
    <text x="44" y="24" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="20" letter-spacing="1">BK TAJIR</text>
    <text x="142" y="24" fill="#F59E0B" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13">/ STORE</text>

    <!-- Nav Pills -->
    <text x="320" y="22" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13">Luxury Watches</text>
    <text x="450" y="22" fill="#9CA3AF" font-family="sans-serif" font-weight="500" font-size="13">Wireless Earbuds</text>
    <text x="590" y="22" fill="#9CA3AF" font-family="sans-serif" font-weight="500" font-size="13">Premium Shoes</text>
    <text x="730" y="22" fill="#9CA3AF" font-family="sans-serif" font-weight="500" font-size="13">Track Order</text>

    <!-- Cart Button -->
    <rect x="910" y="0" width="130" height="32" rx="4" fill="#1F232E" stroke="#373D4E" stroke-width="1" />
    <text x="930" y="21" fill="#FCD34D" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12">SHOPPING CART (2)</text>
  </g>

  <!-- Hero Banner Strip -->
  <g transform="translate(80, 165)">
    <rect width="1040" height="70" rx="6" fill="#151821" stroke="#252A38" stroke-width="1" />
    <text x="24" y="32" fill="#F59E0B" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700" letter-spacing="1.5">OFFICIAL E-COMMERCE PLATFORM</text>
    <text x="24" y="54" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="800">Original Luxury Timepieces, Wireless Audio &amp; Handcrafted Footwear</text>
    
    <rect x="880" y="18" width="135" height="34" rx="4" fill="url(#bk-gold)" />
    <text x="902" y="40" fill="#0B0C10" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12">EXPLORE SHOP</text>
  </g>

  <!-- Three Product Showcase Columns -->
  <!-- Product 1: Luxury Watch -->
  <g transform="translate(80, 255)">
    <rect width="330" height="295" rx="6" fill="url(#bk-card-bg)" stroke="#272C3B" stroke-width="1" />
    <rect x="16" y="16" width="298" height="150" rx="4" fill="#0D0F15" stroke="#1F2432" stroke-width="1" />
    
    <!-- Watch Vector Graphic -->
    <g transform="translate(165, 91)">
      <!-- Watch Strap -->
      <rect x="-16" y="-62" width="32" height="124" rx="3" fill="#1C1F28" stroke="#323849" stroke-width="1" />
      <rect x="-12" y="-55" width="24" height="110" fill="#242834" />
      <!-- Bezel Outer -->
      <circle cx="0" cy="0" r="42" fill="#0E1017" stroke="url(#bk-gold)" stroke-width="4" />
      <circle cx="0" cy="0" r="34" fill="#141720" stroke="#373D4E" stroke-width="1" />
      <!-- Dial Markers -->
      <circle cx="0" cy="-26" r="2.5" fill="#F59E0B" />
      <circle cx="26" cy="0" r="2.5" fill="#F59E0B" />
      <circle cx="0" cy="26" r="2.5" fill="#F59E0B" />
      <circle cx="-26" cy="0" r="2.5" fill="#F59E0B" />
      <!-- Watch Hands -->
      <line x1="0" y1="0" x2="16" y2="-12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="0" x2="-8" y2="-18" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3.5" fill="#F59E0B" />
    </g>

    <text x="18" y="192" fill="#F59E0B" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700">CATEGORY // TIMEPIECES</text>
    <text x="18" y="214" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="15">Oyster Royal Chronometer</text>
    <text x="18" y="235" fill="#9CA3AF" font-family="sans-serif" font-size="11">Precision Quartz · Sapphire Crystal Glass</text>
    
    <text x="18" y="268" fill="#FCD34D" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="17">PKR 12,499</text>
    <rect x="220" y="248" width="94" height="28" rx="4" fill="#242A38" stroke="#3A4358" stroke-width="1" />
    <text x="236" y="266" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="11">ADD TO BAG</text>
  </g>

  <!-- Product 2: Wireless Earbuds -->
  <g transform="translate(435, 255)">
    <rect width="330" height="295" rx="6" fill="url(#bk-card-bg)" stroke="#272C3B" stroke-width="1" />
    <rect x="16" y="16" width="298" height="150" rx="4" fill="#0D0F15" stroke="#1F2432" stroke-width="1" />
    
    <!-- Earbuds Vector Graphic -->
    <g transform="translate(165, 91)">
      <!-- Charging Case -->
      <rect x="-38" y="-22" width="76" height="52" rx="14" fill="#1C202B" stroke="#3A4359" stroke-width="2" />
      <ellipse cx="0" cy="-2" rx="28" ry="14" fill="#141720" />
      <circle cx="0" cy="16" r="3" fill="#10B981" />
      <!-- Left Earbud -->
      <g transform="translate(-20, -18)">
        <ellipse cx="0" cy="0" rx="9" ry="12" fill="#2E3547" stroke="#F59E0B" stroke-width="1.5" />
        <rect x="-2" y="8" width="4" height="18" rx="2" fill="#F59E0B" />
      </g>
      <!-- Right Earbud -->
      <g transform="translate(20, -18)">
        <ellipse cx="0" cy="0" rx="9" ry="12" fill="#2E3547" stroke="#F59E0B" stroke-width="1.5" />
        <rect x="-2" y="8" width="4" height="18" rx="2" fill="#F59E0B" />
      </g>
    </g>

    <text x="18" y="192" fill="#F59E0B" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700">CATEGORY // WIRELESS AUDIO</text>
    <text x="18" y="214" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="15">Acoustic Pro ANC Earbuds</text>
    <text x="18" y="235" fill="#9CA3AF" font-family="sans-serif" font-size="11">Active Noise Cancellation · 36h Playtime</text>
    
    <text x="18" y="268" fill="#FCD34D" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="17">PKR 4,899</text>
    <rect x="220" y="248" width="94" height="28" rx="4" fill="#242A38" stroke="#3A4358" stroke-width="1" />
    <text x="236" y="266" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="11">ADD TO BAG</text>
  </g>

  <!-- Product 3: Premium Shoes -->
  <g transform="translate(790, 255)">
    <rect width="330" height="295" rx="6" fill="url(#bk-card-bg)" stroke="#272C3B" stroke-width="1" />
    <rect x="16" y="16" width="298" height="150" rx="4" fill="#0D0F15" stroke="#1F2432" stroke-width="1" />
    
    <!-- Shoe Vector Silhouette Graphic -->
    <g transform="translate(165, 91)">
      <!-- Sole -->
      <path d="M -60 16 Q -20 18 20 16 Q 50 14 62 8 Q 65 14 60 22 Q 20 25 -20 24 Q -55 24 -62 16 Z" fill="#D97706" />
      <!-- Upper Body -->
      <path d="M -58 14 Q -45 -12 -15 -18 Q 15 -22 35 -6 Q 52 4 62 8 Q 20 14 -20 16 Z" fill="#1E2330" stroke="#3A4359" stroke-width="1.5" />
      <!-- Collar & Tongue -->
      <path d="M -30 -12 Q -15 -28 5 -18 Q -5 -8 -15 -8 Z" fill="#2A3042" />
      <!-- Laces -->
      <line x1="-12" y1="-14" x2="-2" y2="-10" stroke="#F59E0B" stroke-width="1.5" />
      <line x1="-8" y1="-9" x2="2" y2="-5" stroke="#F59E0B" stroke-width="1.5" />
      <line x1="-4" y1="-4" x2="6" y2="0" stroke="#F59E0B" stroke-width="1.5" />
    </g>

    <text x="18" y="192" fill="#F59E0B" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700">CATEGORY // FOOTWEAR</text>
    <text x="18" y="214" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="15">Handcrafted Leather Oxfords</text>
    <text x="18" y="235" fill="#9CA3AF" font-family="sans-serif" font-size="11">Genuine Leather · Ergonomic Insole</text>
    
    <text x="18" y="268" fill="#FCD34D" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="17">PKR 7,299</text>
    <rect x="220" y="248" width="94" height="28" rx="4" fill="#242A38" stroke="#3A4358" stroke-width="1" />
    <text x="236" y="266" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="11">ADD TO BAG</text>
  </g>

  <!-- Bottom Technical Engineering Footnote -->
  <g transform="translate(80, 570)">
    <rect width="1040" height="60" rx="4" fill="#141720" stroke="#252A38" stroke-width="1" />
    <rect x="0" y="0" width="4" height="60" fill="url(#bk-gold)" />
    
    <text x="24" y="24" fill="#9CA3AF" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700">TECHNICAL ARCHITECTURE // PRODUCTION E-COMMERCE</text>
    <text x="24" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="12">
      React 19 + Vite SPA Bundling · Cash on Delivery Checkout · Meta Pixel Event Integration · Google JSON-LD Schema (OnlineStore, FAQ)
    </text>
    
    <rect x="910" y="16" width="110" height="28" rx="4" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="1" />
    <text x="926" y="34" fill="#10B981" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700">LIVE AT BKTAJIR.COM</text>
  </g>
</svg>
