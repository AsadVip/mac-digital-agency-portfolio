<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F9F8" />
      <stop offset="100%" stop-color="#F2F2EF" />
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#p2-bg)" />
  <rect x="30" y="30" width="740" height="490" rx="4" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />

  <!-- Editorial Top bar -->
  <line x1="30" y1="80" x2="770" y2="80" stroke="#E4E4E7" stroke-width="1" />
  <text x="60" y="62" fill="#121316" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" letter-spacing="2">LUMINA STUDIO</text>
  <text x="680" y="62" fill="#71717A" font-family="sans-serif" font-size="12">EDITION 02</text>

  <!-- Editorial layout inside -->
  <rect x="60" y="110" width="180" height="12" rx="2" fill="#E5A910" />
  <text x="60" y="155" fill="#121316" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">Tactile Elegance</text>
  <text x="60" y="185" fill="#121316" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">&amp; Modern Clarity.</text>
  
  <text x="60" y="220" fill="#52525B" font-family="sans-serif" font-size="12" width="280">Art-directed digital experiences designed for luxury fashion and modern architecture.</text>

  <!-- Visual gallery grid inside -->
  <g transform="translate(420, 110)">
    <rect width="300" height="230" fill="#18181B" rx="2" />
    <rect x="20" y="20" width="260" height="190" fill="#24262C" />
    <circle cx="150" cy="115" r="45" fill="none" stroke="#E5A910" stroke-width="2" />
    <line x1="85" y1="115" x2="215" y2="115" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  </g>

  <!-- Bottom section with 3 columns -->
  <g transform="translate(60, 370)">
    <rect width="210" height="110" fill="#FAFAF9" stroke="#E4E4E7" stroke-width="1" rx="2" />
    <text x="20" y="35" fill="#121316" font-family="sans-serif" font-weight="600" font-size="13">01 / ARCHITECTURE</text>
    <text x="20" y="65" fill="#71717A" font-family="sans-serif" font-size="11">Modular grid systems and</text>
    <text x="20" y="82" fill="#71717A" font-family="sans-serif" font-size="11">responsive typography scales.</text>
  </g>

  <g transform="translate(295, 370)">
    <rect width="210" height="110" fill="#FAFAF9" stroke="#E4E4E7" stroke-width="1" rx="2" />
    <text x="20" y="35" fill="#121316" font-family="sans-serif" font-weight="600" font-size="13">02 / INTERACTION</text>
    <text x="20" y="65" fill="#71717A" font-family="sans-serif" font-size="11">Subtle 300ms transitions</text>
    <text x="20" y="82" fill="#71717A" font-family="sans-serif" font-size="11">with zero layout shifts.</text>
  </g>

  <g transform="translate(530, 370)">
    <rect width="200" height="110" fill="#18181B" rx="2" />
    <text x="20" y="35" fill="#E5A910" font-family="sans-serif" font-weight="600" font-size="13">03 / PERFORMANCE</text>
    <text x="20" y="65" fill="#D4D4D8" font-family="sans-serif" font-size="11">100/100 Lighthouse score</text>
    <text x="20" y="82" fill="#D4D4D8" font-family="sans-serif" font-size="11">and instant hydration.</text>
  </g>
</svg>
