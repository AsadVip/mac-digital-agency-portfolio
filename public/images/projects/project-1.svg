<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>
    <linearGradient id="p1-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5A910" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <pattern id="p1-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="url(#p1-bg)" />
  <rect width="1200" height="700" fill="url(#p1-grid)" />

  <!-- Frame border -->
  <rect x="50" y="50" width="1100" height="600" rx="4" fill="#1C1D21" stroke="#2D2F36" stroke-width="1.5" />
  
  <!-- Browser top bar -->
  <rect x="50" y="50" width="1100" height="52" fill="#24262C" />
  <circle cx="85" cy="76" r="6" fill="#4B4E58" />
  <circle cx="107" cy="76" r="6" fill="#4B4E58" />
  <circle cx="129" cy="76" r="6" fill="#4B4E58" />
  <rect x="160" y="64" width="460" height="24" rx="4" fill="#18181B" />
  <text x="180" y="80" fill="#9CA3AF" font-family="monospace" font-size="12">apex-horizon.app/dashboard/analytics</text>
  
  <!-- Accent highlight bar -->
  <rect x="50" y="100" width="1100" height="2" fill="url(#p1-accent)" />

  <!-- App Header -->
  <rect x="90" y="140" width="320" height="28" rx="2" fill="#32353E" />
  <rect x="90" y="180" width="200" height="12" rx="2" fill="#4A4E5A" />
  <rect x="1000" y="140" width="110" height="34" rx="4" fill="#E5A910" />
  <text x="1025" y="162" fill="#121316" font-family="sans-serif" font-weight="bold" font-size="13">EXPORT</text>

  <!-- Metric boxes -->
  <g transform="translate(90, 230)">
    <rect width="230" height="110" rx="4" fill="#24262C" stroke="#32353E" stroke-width="1" />
    <text x="24" y="40" fill="#9CA3AF" font-family="sans-serif" font-size="12" letter-spacing="1">CLIENT SESSIONS</text>
    <text x="24" y="82" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="700">99.98%</text>
    <rect x="175" y="24" width="35" height="18" rx="3" fill="rgba(229,169,16,0.15)" />
    <text x="182" y="37" fill="#E5A910" font-family="monospace" font-size="10">+18%</text>
  </g>

  <g transform="translate(345, 230)">
    <rect width="230" height="110" rx="4" fill="#24262C" stroke="#32353E" stroke-width="1" />
    <text x="24" y="40" fill="#9CA3AF" font-family="sans-serif" font-size="12" letter-spacing="1">API LATENCY</text>
    <text x="24" y="82" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="700">42ms</text>
    <rect x="175" y="24" width="35" height="18" rx="3" fill="rgba(229,169,16,0.15)" />
    <text x="182" y="37" fill="#E5A910" font-family="monospace" font-size="10">-35%</text>
  </g>

  <g transform="translate(600, 230)">
    <rect width="230" height="110" rx="4" fill="#24262C" stroke="#32353E" stroke-width="1" />
    <text x="24" y="40" fill="#9CA3AF" font-family="sans-serif" font-size="12" letter-spacing="1">SYNC STATUS</text>
    <text x="24" y="82" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="700">REALTIME</text>
    <circle cx="190" cy="33" r="5" fill="#E5A910" />
  </g>

  <g transform="translate(855, 230)">
    <rect width="255" height="110" rx="4" fill="#24262C" stroke="#32353E" stroke-width="1" />
    <text x="24" y="40" fill="#9CA3AF" font-family="sans-serif" font-size="12" letter-spacing="1">SECURITY MODEL</text>
    <text x="24" y="82" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="700">RLS ACTIVE</text>
  </g>

  <!-- Large Data Visual Chart -->
  <g transform="translate(90, 370)">
    <rect width="1020" height="230" rx="4" fill="#24262C" stroke="#32353E" stroke-width="1" />
    <text x="30" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">PostgreSQL Performance Curve &amp; Query Distribution</text>
    <line x1="30" y1="65" x2="990" y2="65" stroke="#32353E" />
    <line x1="30" y1="110" x2="990" y2="110" stroke="#32353E" stroke-dasharray="4,4" />
    <line x1="30" y1="155" x2="990" y2="155" stroke="#32353E" stroke-dasharray="4,4" />
    <line x1="30" y1="200" x2="990" y2="200" stroke="#32353E" />
    
    <!-- Path vector -->
    <path d="M 50 180 Q 200 160 350 140 T 650 90 T 950 65" fill="none" stroke="#E5A910" stroke-width="3" />
    <circle cx="350" cy="140" r="5" fill="#E5A910" />
    <circle cx="650" cy="90" r="5" fill="#E5A910" />
    <circle cx="950" cy="65" r="6" fill="#FFFFFF" stroke="#E5A910" stroke-width="3" />
  </g>
</svg>
